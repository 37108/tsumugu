name: Release

# Only on the default branch. A release is a consequence of merging, never of
# opening a pull request, and never of a fork's branch.
on:
  push:
    branches: [main]

# The one workflow in this repository that writes anything. It needs to open the
# version pull request Changesets maintains, and to publish with npm's trusted
# publishing, which exchanges the id-token for a short-lived credential rather
# than storing a long-lived one.
permissions:
  contents: write
  pull-requests: write
  id-token: write

# Two releases at once would race over the same versions and the same registry.
# This queue never cancels: a run that is already publishing must finish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      # Full history, because Changesets compares against the base branch to
      # decide which packages a changeset touches.
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same gate contributors run locally. A release that skipped it would
      # be the one build nobody checked.
      - name: Check
        run: pnpm run check

      # Two behaviours in one step, decided by whether unreleased changesets
      # exist: with changesets it opens or updates the version pull request;
      # with none, on a commit that merged that pull request, it publishes.
      - name: Version or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # What the registry received, read back from the registry.
      #
      # `workspace:*` means something only inside this repository. pnpm replaces
      # it while packing and npm does not, so a package published by hand with
      # the wrong command lands on the registry looking fine and refusing to
      # install. That happened on 2026-07-30 and cost a second release; nothing
      # noticed until somebody tried to install it.
      #
      # This asks npm what it now serves, so it catches a bad publish however it
      # was made — including one made from a laptop.
      - name: Check that every published package can be installed
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo '${{ steps.changesets.outputs.publishedPackages }}' \
            | jq -r '.[] | "\(.name)@\(.version)"' \
            | while read -r spec; do
                echo "checking $spec"
                unresolved=$(npm view "$spec" dependencies --json --registry https://registry.npmjs.org/ \
                  | jq -r 'if type == "array" then .[0] else . end | to_entries[]? | select(.value | startswith("workspace:")) | .key')
                if [ -n "$unresolved" ]; then
                  echo "::error::$spec was published with unresolved workspace dependencies: $unresolved"
                  exit 1
                fi
              done
