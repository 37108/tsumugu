# Workspace layout. See docs/designs/architecture/workspaces.md for the dependency rules.
#
# - packages/*  publishable-intent packages (still private during pre-alpha)
# - internal/*  internal-only workspaces that must never be published
packages:
  - packages/*
  - internal/*

# Supply-chain hardening.
#
# minimumReleaseAge delays adoption of freshly published versions so that a
# compromised release has a window to be detected and unpublished before it can
# enter the lockfile. 30240 minutes is 21 days.
minimumReleaseAge: 30240

# postcss <= 8.5.17 is vulnerable to path traversal via sourceMappingURL
# auto-loading (GHSA advisory, Dependabot alert #1). It only reaches this
# workspace transitively through vite, whose range already allows the fix.
overrides:
  postcss: ">=8.5.18"

# The patched postcss (published 2026-07-12) is newer than the 21-day maturity
# window, and shipping a known path-traversal fix outweighs the wait. Remove
# this exclusion after 2026-08-02, when 8.5.18 clears minimumReleaseAge.
minimumReleaseAgeExclude:
  - postcss
  - nanoid # postcss 8.5.18's own dependency, released the same day

# No dependency is allowed to run install scripts. pnpm blocks them by default;
# stating the empty allowlist explicitly makes the decision reviewable and makes
# any future exception show up in a diff.
onlyBuiltDependencies: []

# Enforce engines.node at install time. Without this the minimum supported
# runtime in docs/designs/compatibility.md is advisory, and an unsupported runtime
# surfaces later as an unrelated error instead of a clear install failure.
engineStrict: true

# @parcel/watcher is @tailwindcss/cli's optional file-watcher, used only by
# `tailwindcss --watch`, which nothing here runs — styles compile one-shot in
# `pnpm styles`. false keeps its native postinstall from ever executing while
# letting `pnpm install` exit cleanly, which is the same decision the empty
# allowlist above records for everything else.
allowBuilds:
  "@parcel/watcher": false
